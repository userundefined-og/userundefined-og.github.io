<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 298" width="780" height="298" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="776" height="294" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <text x="22" y="28" font-size="15" font-weight="700" fill="#e6edf3">Scoring &amp; Classifying Candidate Daily Puzzles</text>
  <text x="22" y="47" font-size="12" fill="#8b949e">Solution count alone doesn't predict human difficulty, so each candidate runs through three quick probes</text>

  <!-- Step 1: Candidate Mix -->
  <rect x="22" y="72" width="176" height="176" rx="8" fill="#21262d" stroke="#484f58" stroke-width="1.3"/>
  <text x="36" y="95" font-size="12" font-weight="700" fill="#e6edf3">1. Balanced Candidate</text>
  <text x="36" y="114" font-size="10.5" fill="#c9d1d9">Shuffle <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(Q, R, B)</tspan> &amp; binary-</text>
  <text x="36" y="129" font-size="10.5" fill="#c9d1d9">search max <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">N</tspan>, capped at:</text>
  <rect x="36" y="139" width="148" height="44" rx="5" fill="#1c2128" stroke="#484f58" stroke-width="1"/>
  <text x="46" y="156" font-size="10.5" font-weight="600" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">N &lt;= min(6, Q+R+B)</text>
  <text x="46" y="173" font-size="10.5" font-weight="600" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">B &lt;= 5, total &gt;= 8</text>
  <text x="36" y="203" font-size="10.5" fill="#8b949e">Test top 5 knight counts</text>
  <text x="36" y="218" font-size="10.5" fill="#8b949e">(plus 5 interior blocks</text>
  <text x="36" y="233" font-size="10.5" fill="#8b949e">for Anarchy mode)</text>

  <line x1="198" y1="160" x2="226" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Step 2: Three Probes -->
  <rect x="230" y="72" width="248" height="52" rx="7" fill="#21262d" stroke="#388bfd" stroke-width="1.4"/>
  <text x="244" y="92" font-size="11.5" font-weight="700" fill="#79c0ff">Solver Sample (25ms cap)</text>
  <text x="244" y="109" font-size="10.5" fill="#c9d1d9">Up to 120 solutions &amp; unattacked squares</text>

  <rect x="230" y="134" width="248" height="52" rx="7" fill="#21262d" stroke="#388bfd" stroke-width="1.4"/>
  <text x="244" y="154" font-size="11.5" font-weight="700" fill="#79c0ff">2,500 Random Trials</text>
  <text x="244" y="171" font-size="10.5" fill="#c9d1d9">Random legal bitmask picks -&gt; win rate</text>

  <rect x="230" y="196" width="248" height="52" rx="7" fill="#21262d" stroke="#388bfd" stroke-width="1.4"/>
  <text x="244" y="216" font-size="11.5" font-weight="700" fill="#79c0ff">5 Forward-Checking Probes</text>
  <text x="244" y="233" font-size="10.5" fill="#c9d1d9">500-step cap catches deep dead-end traps</text>

  <line x1="478" y1="160" x2="506" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Step 3: Tier Buckets -->
  <rect x="510" y="72" width="248" height="39" rx="6" fill="#12261e" stroke="#2ea043" stroke-width="1.4"/>
  <text x="522" y="90" font-size="11.5" font-weight="700" fill="#7ee787">Easy: win rate &gt;= 6.0%</text>
  <text x="522" y="104" font-size="10" fill="#56d364">Forgiving openings, tight coverage</text>

  <rect x="510" y="117" width="248" height="39" rx="6" fill="#23183c" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="522" y="135" font-size="11.5" font-weight="700" fill="#d8b4fe">Anarchy: Easy rate + 5 blocks</text>
  <text x="522" y="149" font-size="10" fill="#d8b4fe">Bonus when blocks shield sliders</text>

  <rect x="510" y="162" width="248" height="39" rx="6" fill="#2d2111" stroke="#d29922" stroke-width="1.4"/>
  <text x="522" y="180" font-size="11.5" font-weight="700" fill="#f2cc60">Medium: 1.2% to 6.0% win rate</text>
  <text x="522" y="194" font-size="10" fill="#c9d1d9">Requires planning slider lanes</text>

  <rect x="510" y="207" width="248" height="41" rx="6" fill="#311619" stroke="#f85149" stroke-width="1.4"/>
  <text x="522" y="225" font-size="11.5" font-weight="700" fill="#ffa198">Hard: win rate &lt; 1.2%</text>
  <text x="522" y="240" font-size="10" fill="#ff7b72">Rejects needle-in-a-haystack traps</text>

  <text x="390" y="278" font-size="11.5" fill="#8b949e" text-anchor="middle">
    Candidates also lose points for leaving unattacked squares or letting one piece type exceed 45% of the tray
  </text>
</svg>