<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 298" width="780" height="298" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="776" height="294" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="22" y="28" font-size="15" font-weight="700" fill="#0f172a">Scoring &amp; Classifying Candidate Daily Puzzles</text>
  <text x="22" y="47" font-size="12" fill="#475569">Solution count alone doesn't predict human difficulty, so each candidate runs through three quick probes</text>

  <!-- Step 1: Candidate Mix -->
  <rect x="22" y="72" width="176" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="36" y="95" font-size="12" font-weight="700" fill="#0f172a">1. Balanced Candidate</text>
  <text x="36" y="114" font-size="10.5" fill="#334155">Shuffle <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(Q, R, B)</tspan> &amp; binary-</text>
  <text x="36" y="129" font-size="10.5" fill="#334155">search max <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">N</tspan>, capped at:</text>
  <rect x="36" y="139" width="148" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="156" font-size="10.5" font-weight="600" fill="#1d4ed8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">N &lt;= min(6, Q+R+B)</text>
  <text x="46" y="173" font-size="10.5" font-weight="600" fill="#1d4ed8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">B &lt;= 5, total &gt;= 8</text>
  <text x="36" y="203" font-size="10.5" fill="#64748b">Test top 5 knight counts</text>
  <text x="36" y="218" font-size="10.5" fill="#64748b">(plus 5 interior blocks</text>
  <text x="36" y="233" font-size="10.5" fill="#64748b">for Anarchy mode)</text>

  <line x1="198" y1="160" x2="226" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Step 2: Three Probes -->
  <rect x="230" y="72" width="248" height="52" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="244" y="92" font-size="11.5" font-weight="700" fill="#1d4ed8">Solver Sample (25ms cap)</text>
  <text x="244" y="109" font-size="10.5" fill="#334155">Up to 120 solutions &amp; unattacked squares</text>

  <rect x="230" y="134" width="248" height="52" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="244" y="154" font-size="11.5" font-weight="700" fill="#1d4ed8">2,500 Random Trials</text>
  <text x="244" y="171" font-size="10.5" fill="#334155">Random legal bitmask picks -&gt; win rate</text>

  <rect x="230" y="196" width="248" height="52" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="244" y="216" font-size="11.5" font-weight="700" fill="#1d4ed8">5 Forward-Checking Probes</text>
  <text x="244" y="233" font-size="10.5" fill="#334155">500-step cap catches deep dead-end traps</text>

  <line x1="478" y1="160" x2="506" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Step 3: Tier Buckets -->
  <rect x="510" y="72" width="248" height="39" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
  <text x="522" y="90" font-size="11.5" font-weight="700" fill="#14532d">Easy: win rate &gt;= 6.0%</text>
  <text x="522" y="104" font-size="10" fill="#15803d">Forgiving openings, tight coverage</text>

  <rect x="510" y="117" width="248" height="39" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="522" y="135" font-size="11.5" font-weight="700" fill="#5b21b6">Anarchy: Easy rate + 5 blocks</text>
  <text x="522" y="149" font-size="10" fill="#5b21b6">Bonus when blocks shield sliders</text>

  <rect x="510" y="162" width="248" height="39" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="522" y="180" font-size="11.5" font-weight="700" fill="#92400e">Medium: 1.2% to 6.0% win rate</text>
  <text x="522" y="194" font-size="10" fill="#334155">Requires planning slider lanes</text>

  <rect x="510" y="207" width="248" height="41" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="522" y="225" font-size="11.5" font-weight="700" fill="#991b1b">Hard: win rate &lt; 1.2%</text>
  <text x="522" y="240" font-size="10" fill="#b91c1c">Rejects needle-in-a-haystack traps</text>

  <text x="390" y="278" font-size="11.5" fill="#64748b" text-anchor="middle">
    Candidates also lose points for leaving unattacked squares or letting one piece type exceed 45% of the tray
  </text>
</svg>