<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 304" width="780" height="304" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="776" height="300" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <text x="22" y="28" font-size="15" font-weight="700" fill="#e6edf3">Constructive vs. Corrective Hint Pipeline</text>
  <text x="22" y="47" font-size="12" fill="#8b949e">A board with zero red conflicts can still be a dead end, so hints verify completability before suggesting a move</text>

  <rect x="22" y="72" width="166" height="64" rx="7" fill="#13233a" stroke="#388bfd" stroke-width="1.5"/>
  <text x="105" y="96" font-size="12" font-weight="700" fill="#a5d6ff" text-anchor="middle">Player's Current Board</text>
  <text x="105" y="114" font-size="10.5" fill="#79c0ff" text-anchor="middle">Lock placed pieces as</text>
  <text x="105" y="128" font-size="10.5" fill="#79c0ff" text-anchor="middle">1-square domains &amp; solve</text>

  <line x1="188" y1="104" x2="290" y2="104" stroke="#3fb950" stroke-width="1.7" marker-end="url(#arrowGreen)"/>
  <text x="239" y="96" font-size="10.5" font-weight="700" fill="#56d364" text-anchor="middle">completion found</text>

  <rect x="294" y="72" width="464" height="64" rx="7" fill="#12261e" stroke="#2ea043" stroke-width="1.5"/>
  <text x="312" y="96" font-size="12.5" font-weight="700" fill="#7ee787">Constructive Hint: place 1 valid piece</text>
  <text x="312" y="115" font-size="11" fill="#c9d1d9">Randomized value order picks a completion; reveals the most constraining</text>
  <text x="312" y="130" font-size="11" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">unplaced piece type first: Queen -&gt; Rook -&gt; Bishop -&gt; Knight</text>

  <path d="M 105 136 L 105 214 L 146 214" fill="none" stroke="#d29922" stroke-width="1.7" marker-end="url(#arrowAmber)"/>
  <text x="98" y="176" font-size="10.5" font-weight="700" fill="#f2cc60" text-anchor="end">conflict or</text>
  <text x="98" y="190" font-size="10.5" fill="#f2cc60" text-anchor="end">dead end</text>

  <rect x="150" y="168" width="182" height="92" rx="7" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="164" y="189" font-size="11.5" font-weight="700" fill="#f2cc60">Stage 1: Drop 1 piece</text>
  <text x="164" y="207" font-size="10.5" fill="#c9d1d9">Test removing each piece</text>
  <text x="164" y="222" font-size="10.5" fill="#c9d1d9">(conflicts &amp; newest first),</text>
  <text x="164" y="237" font-size="10.5" fill="#8b949e">20ms solve cap per try</text>
  <text x="164" y="252" font-size="10" font-weight="600" fill="#f2cc60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">solvable -&gt; remove it</text>

  <line x1="332" y1="214" x2="364" y2="214" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="348" y="206" font-size="9.5" fill="#8b949e" text-anchor="middle">none</text>

  <rect x="368" y="168" width="182" height="92" rx="7" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="382" y="189" font-size="11.5" font-weight="700" fill="#f2cc60">Stage 2: Drop 2 pieces</text>
  <text x="382" y="207" font-size="10.5" fill="#c9d1d9">Test removing pairs in the</text>
  <text x="382" y="222" font-size="10.5" fill="#c9d1d9">same priority order within</text>
  <text x="382" y="237" font-size="10.5" fill="#8b949e">a 60ms total budget</text>
  <text x="382" y="252" font-size="10" font-weight="600" fill="#f2cc60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">solvable -&gt; remove 1st</text>

  <line x1="550" y1="214" x2="582" y2="214" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="566" y="206" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">none</text>

  <rect x="586" y="168" width="172" height="92" rx="7" fill="#2d2111" stroke="#d29922" stroke-width="1.5"/>
  <text x="600" y="189" font-size="11.5" font-weight="700" fill="#f2cc60">Stage 3: Closest solve</text>
  <text x="600" y="207" font-size="10.5" fill="#c9d1d9">Solve empty board with</text>
  <text x="600" y="222" font-size="10.5" fill="#c9d1d9">heuristic preferring the</text>
  <text x="600" y="237" font-size="10.5" fill="#c9d1d9">player's squares</text>
  <text x="600" y="252" font-size="10" font-weight="600" fill="#f2cc60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">flag 1 non-matching</text>

  <text x="390" y="286" font-size="11.5" fill="#8b949e" text-anchor="middle">
    Every stage reuses the exact same 64-bit CSP solver with short timeouts
  </text>
</svg>