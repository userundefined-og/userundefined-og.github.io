<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="776" height="326" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="22" y="28" font-size="15" font-weight="700" fill="#0f172a">Plain Backtracking vs. Conflict-Directed Backjumping</text>
  <text x="22" y="47" font-size="12" fill="#475569">A top-left mistake at depth 0 isn't exposed until depth 3, after two unrelated bottom-right decisions</text>

  <!-- ================= LEFT: PLAIN BACKTRACKING ================= -->
  <rect x="22" y="130" width="152" height="90" rx="7" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="34" y="150" font-size="11.5" font-weight="700" fill="#991b1b">Plain backtracking</text>
  <text x="34" y="168" font-size="11" fill="#334155">Steps to depth 2, then 1,</text>
  <text x="34" y="184" font-size="11" fill="#334155">trying bottom-right words</text>
  <text x="34" y="200" font-size="11" fill="#64748b">that all hit the same</text>
  <text x="34" y="214" font-size="11" fill="#64748b">top-left wipeout</text>

  <!-- Red dashed single-level backtrack hops along left side of tree -->
  <path d="M 214 258 C 182 252, 182 212, 210 206" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <path d="M 214 196 C 182 190, 182 154, 210 148" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <path d="M 214 138 C 182 132, 182 96, 210 90" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>

  <!-- ================= CENTER: SEARCH PATH (DEPTHS 0..3) ================= -->
  <!-- Depth 0: culprit in top-left -->
  <rect x="214" y="68" width="312" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="226" y="86" font-size="11.5" font-weight="700" fill="#1e3a8a">depth 0: 1-Across = "como" (top-left)</text>
  <text x="226" y="103" font-size="10.5" fill="#1d4ed8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prunes "ibex" from 2-Down -&gt; nogood {0}</text>

  <line x1="370" y1="112" x2="370" y2="123" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowSlate)"/>

  <!-- Depth 1: unrelated bottom-right -->
  <rect x="214" y="126" width="312" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="226" y="144" font-size="11.5" font-weight="600" fill="#334155">depth 1: 25-Across = "crane" (bottom-right)</text>
  <text x="226" y="160" font-size="10.5" fill="#64748b">unrelated corner - doesn't touch 2-Down</text>

  <line x1="370" y1="168" x2="370" y2="179" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowSlate)"/>

  <!-- Depth 2: unrelated bottom-right -->
  <rect x="214" y="182" width="312" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="226" y="200" font-size="11.5" font-weight="600" fill="#334155">depth 2: 28-Down = "orbit" (bottom-right)</text>
  <text x="226" y="216" font-size="10.5" fill="#64748b">unrelated corner - doesn't touch 2-Down</text>

  <line x1="370" y1="224" x2="370" y2="235" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowSlate)"/>

  <!-- Depth 3: wipeout in top-left -->
  <rect x="214" y="238" width="312" height="54" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="226" y="256" font-size="11.5" font-weight="700" fill="#991b1b">depth 3: 6-Across wipes out 2-Down (top-left)</text>
  <text x="226" y="272" font-size="10.5" fill="#7f1d1d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2-Down conflicts: "ibex"-&gt;{0}, "onyx"-&gt;{3}</text>
  <text x="226" y="286" font-size="10.5" font-weight="700" fill="#991b1b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ancestor culprit = {0}</text>

  <!-- ================= RIGHT: BACKJUMP ARC ================= -->
  <path d="M 526 265 C 574 265, 574 90, 530 90" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <rect x="582" y="130" width="176" height="90" rx="7" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="594" y="150" font-size="11.5" font-weight="700" fill="#14532d">Backjump to depth 0</text>
  <text x="594" y="168" font-size="11" fill="#1e293b">Depths 1 &amp; 2 aren't in</text>
  <text x="594" y="184" font-size="11" fill="#1e293b">the conflict set, so undo</text>
  <text x="594" y="200" font-size="11" fill="#15803d">them without trying</text>
  <text x="594" y="214" font-size="11" fill="#15803d">their other candidates</text>

  <!-- Footer -->
  <text x="390" y="314" font-size="11.5" fill="#334155" text-anchor="middle">
    Each pruned value records a <tspan font-weight="700" fill="#0f172a">nogood</tspan> (responsible depths); a variable's <tspan font-weight="700" fill="#0f172a">conflict set</tspan> holds the nogoods of its pruned values
  </text>
</svg>
