<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" width="780" height="336" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="776" height="332" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="22" y="28" font-size="15" font-weight="700" fill="#0f172a">Bitmask Domain Pruning (Prune Outside Mask)</text>
  <text x="22" y="47" font-size="12" fill="#475569">1-Down puts 'a' at pos 2 of 2-Across: one bitwise op filters 64 candidates per bucket (8 shown)</text>

  <!-- Column headers: indices & sample words -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="256" y="70" font-size="11" fill="#64748b">idx 0</text>
    <text x="256" y="86" font-size="12" fill="#334155">ab<tspan font-weight="700" fill="#15803d">a</tspan>ck</text>

    <text x="324" y="70" font-size="11" fill="#64748b">idx 1</text>
    <text x="324" y="86" font-size="12" fill="#334155">ab<tspan font-weight="700" fill="#15803d">a</tspan>se</text>

    <text x="392" y="70" font-size="11" fill="#64748b">idx 2</text>
    <text x="392" y="86" font-size="12" fill="#334155">ab<tspan font-weight="700" fill="#15803d">a</tspan>te</text>

    <text x="460" y="70" font-size="11" fill="#64748b">idx 3</text>
    <text x="460" y="86" font-size="12" fill="#334155">ab<tspan font-weight="700" fill="#dc2626">b</tspan>ey</text>

    <text x="528" y="70" font-size="11" fill="#64748b">idx 4</text>
    <text x="528" y="86" font-size="12" fill="#334155">ab<tspan font-weight="700" fill="#64748b">b</tspan>ot</text>

    <text x="596" y="70" font-size="11" fill="#64748b">idx 5</text>
    <text x="596" y="86" font-size="12" fill="#334155">ab<tspan font-weight="700" fill="#dc2626">h</tspan>or</text>

    <text x="664" y="70" font-size="11" fill="#64748b">idx 6</text>
    <text x="664" y="86" font-size="12" fill="#334155">ab<tspan font-weight="700" fill="#dc2626">i</tspan>de</text>

    <text x="732" y="70" font-size="11" fill="#64748b">idx 7</text>
    <text x="732" y="86" font-size="12" fill="#334155">ab<tspan font-weight="700" fill="#64748b">l</tspan>ed</text>
  </g>

  <!-- Row 1: liveBits -->
  <text x="22" y="116" font-size="13" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">liveBits</text>
  <text x="22" y="132" font-size="11" fill="#64748b">2-Across live domain</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <!-- 1, 0, 1, 1, 0, 1, 1, 0 -->
    <rect x="225" y="98" width="62" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="256" y="123" fill="#1d4ed8">1</text>

    <rect x="293" y="98" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="324" y="123" fill="#94a3b8">0</text>

    <rect x="361" y="98" width="62" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="392" y="123" fill="#1d4ed8">1</text>

    <rect x="429" y="98" width="62" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="460" y="123" fill="#1d4ed8">1</text>

    <rect x="497" y="98" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="528" y="123" fill="#94a3b8">0</text>

    <rect x="565" y="98" width="62" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="596" y="123" fill="#1d4ed8">1</text>

    <rect x="633" y="98" width="62" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="664" y="123" fill="#1d4ed8">1</text>

    <rect x="701" y="98" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="732" y="123" fill="#94a3b8">0</text>
  </g>

  <!-- Row 2: allowedBits -->
  <text x="22" y="166" font-size="13" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">allowedBits</text>
  <text x="22" y="182" font-size="11" fill="#64748b">ByPosAndLetter[2]['a']</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <!-- 1, 1, 1, 0, 0, 0, 0, 0 -->
    <rect x="225" y="148" width="62" height="38" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="256" y="173" fill="#15803d">1</text>

    <rect x="293" y="148" width="62" height="38" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="324" y="173" fill="#15803d">1</text>

    <rect x="361" y="148" width="62" height="38" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="392" y="173" fill="#15803d">1</text>

    <rect x="429" y="148" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="460" y="173" fill="#94a3b8">0</text>

    <rect x="497" y="148" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="528" y="173" fill="#94a3b8">0</text>

    <rect x="565" y="148" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="596" y="173" fill="#94a3b8">0</text>

    <rect x="633" y="148" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="664" y="173" fill="#94a3b8">0</text>

    <rect x="701" y="148" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="732" y="173" fill="#94a3b8">0</text>
  </g>

  <!-- Bitwise AND-NOT separator -->
  <line x1="22" y1="201" x2="763" y2="201" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="378" y="191" width="232" height="20" rx="10" fill="#e2e8f0"/>
  <text x="494" y="205" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">liveBits &amp; ^allowedBits</text>

  <!-- Row 3: toPrune -->
  <text x="22" y="233" font-size="13" font-weight="600" fill="#b91c1c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">toPrune</text>
  <text x="22" y="249" font-size="11" fill="#64748b">live, wrong letter</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <!-- 0, 0, 0, 1, 0, 1, 1, 0 -->
    <rect x="225" y="215" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="256" y="240" fill="#94a3b8">0</text>

    <rect x="293" y="215" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="324" y="240" fill="#94a3b8">0</text>

    <rect x="361" y="215" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="392" y="240" fill="#94a3b8">0</text>

    <rect x="429" y="215" width="62" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="460" y="240" fill="#b91c1c">1</text>

    <rect x="497" y="215" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="528" y="240" fill="#94a3b8">0</text>

    <rect x="565" y="215" width="62" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="596" y="240" fill="#b91c1c">1</text>

    <rect x="633" y="215" width="62" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="664" y="240" fill="#b91c1c">1</text>

    <rect x="701" y="215" width="62" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="732" y="240" fill="#94a3b8">0</text>
  </g>

  <!-- TrailingZeros64 jump arcs -->
  <path d="M 240 262 Q 350 296 452 260" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <path d="M 468 260 Q 532 292 588 260" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <path d="M 604 260 Q 634 284 656 260" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>

  <text x="392" y="316" font-size="12" fill="#334155" text-anchor="middle">
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#b91c1c">TrailingZeros64</tspan> + <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#0f172a">b &amp;= b - 1</tspan> jumps straight to <tspan font-weight="700" fill="#b91c1c">{3, 5, 6}</tspan>; allowed &amp; already-pruned candidates are skipped
  </text>
</svg>
