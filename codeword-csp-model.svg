<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 342" width="780" height="342" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="776" height="338" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="22" y="28" font-size="15" font-weight="700" fill="#0f172a">Two Variable Sets, Zero Word-to-Word Crossing Constraints</text>
  <text x="22" y="47" font-size="12" fill="#475569">Words pre-filter candidates by number pattern and sync through the number variables in their cells</text>

  <!-- Left Word Variable -->
  <rect x="22" y="66" width="352" height="100" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="36" y="86" font-size="12" font-weight="700" fill="#1d4ed8">Word Variable: [3, 5, 5, 2, 4]</text>
  <rect x="36" y="95" width="30" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="51.0" y="112.5" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3</text>
  <rect x="126" y="95" width="30" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="141.0" y="112.5" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2</text>
  <rect x="156" y="95" width="30" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="171.0" y="112.5" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4</text>
  <rect x="66" y="95" width="30" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="81.0" y="112.5" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5</text>
  <rect x="96" y="95" width="30" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="111.0" y="112.5" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5</text>
  <text x="196" y="112" font-size="10.5" font-weight="700" fill="#92400e">2nd &amp; 3rd match (#5)</text>
  <text x="36" y="139" font-size="10.5" fill="#334155">Keeps: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">"alley", "apple", "asset", "otter"</tspan>...</text>
  <text x="36" y="155" font-size="10" fill="#64748b">Drops "crane", "sleet" up front (different pattern)</text>

  <!-- Right Word Variable -->
  <rect x="406" y="66" width="352" height="100" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="420" y="86" font-size="12" font-weight="700" fill="#1d4ed8">Word Variable: [6, 2, 4, 4, 8]</text>
  <rect x="420" y="95" width="30" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="435.0" y="112.5" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">6</text>
  <rect x="450" y="95" width="30" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="465.0" y="112.5" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2</text>
  <rect x="540" y="95" width="30" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="555.0" y="112.5" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">8</text>
  <rect x="480" y="95" width="30" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="495.0" y="112.5" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4</text>
  <rect x="510" y="95" width="30" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="525.0" y="112.5" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4</text>
  <text x="580" y="112" font-size="10.5" font-weight="700" fill="#92400e">3rd &amp; 4th match (#4)</text>
  <text x="420" y="139" font-size="10.5" fill="#334155">Keeps: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">"bleed", "fleet", "sleep", "sleet"</tspan>...</text>
  <text x="420" y="155" font-size="10" fill="#64748b">Syncs with [3, 5, 5, 2, 4] via #2 &amp; #4 even without crossing</text>

  <!-- Binary Word <-> Number Constraint Links -->
  <line x1="90" y1="168" x2="90" y2="222" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <line x1="210" y1="168" x2="210" y2="222" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <line x1="304" y1="168" x2="322" y2="222" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <line x1="354" y1="168" x2="440" y2="222" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <line x1="426" y1="168" x2="338" y2="222" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <line x1="476" y1="168" x2="458" y2="222" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <line x1="570" y1="168" x2="570" y2="222" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <line x1="690" y1="168" x2="690" y2="222" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <rect x="176" y="186" width="68" height="17" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="210" y="198" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">1 link (#5)</text>

  <!-- Number Variable Tiles -->
  <rect x="44" y="224" width="92" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="90" y="244" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#3</text>
  <text x="90" y="261" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">A..Z (26 bits)</text>
  <line x1="90" y1="270" x2="90" y2="280" stroke="#22c55e" stroke-width="1.4"/>
  <rect x="164" y="224" width="92" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="210" y="244" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#5</text>
  <text x="210" y="261" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">A..Z (26 bits)</text>
  <line x1="210" y1="270" x2="210" y2="280" stroke="#22c55e" stroke-width="1.4"/>
  <rect x="284" y="224" width="92" height="46" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.7"/>
  <text x="330" y="244" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#2</text>
  <text x="330" y="261" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">shared (26 bits)</text>
  <line x1="330" y1="270" x2="330" y2="280" stroke="#22c55e" stroke-width="1.4"/>
  <rect x="404" y="224" width="92" height="46" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.7"/>
  <text x="450" y="244" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#4</text>
  <text x="450" y="261" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">shared (26 bits)</text>
  <line x1="450" y1="270" x2="450" y2="280" stroke="#22c55e" stroke-width="1.4"/>
  <rect x="524" y="224" width="92" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="570" y="244" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#6</text>
  <text x="570" y="261" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">A..Z (26 bits)</text>
  <line x1="570" y1="270" x2="570" y2="280" stroke="#22c55e" stroke-width="1.4"/>
  <rect x="644" y="224" width="92" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="690" y="244" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#8</text>
  <text x="690" y="261" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">A..Z (26 bits)</text>
  <line x1="690" y1="270" x2="690" y2="280" stroke="#22c55e" stroke-width="1.4"/>

  <!-- Bipartite All-Different Bar across all 26 numbers -->
  <rect x="44" y="280" width="692" height="28" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
  <text x="390" y="298" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Bipartite All-Different across all 26 number variables (#1..#26 -&gt; A..Z, 1-to-1)</text>

  <text x="390" y="327" font-size="11.5" fill="#64748b" text-anchor="middle">
    Repeated numbers inside a word (#5, #4) need only 1 link; shared numbers (#2, #4) keep the whole grid in sync
  </text>
</svg>
