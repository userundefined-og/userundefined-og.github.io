<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 312" width="780" height="312" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlueSm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="776" height="308" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="22" y="28" font-size="15" font-weight="700" fill="#0f172a">Generating &amp; Calibrating Daily Codeword Puzzles</text>
  <text x="22" y="47" font-size="12" fill="#475569">Each tier builds a 26-letter grid from everyday words, then searches for starters a human can solve uniquely</text>

  <!-- Step 1: 26-Letter Grid Fill -->
  <rect x="22" y="72" width="204" height="192" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="36" y="94" font-size="12" font-weight="700" fill="#0f172a">1. Fill a 26-Letter Grid</text>
  <text x="36" y="113" font-size="10.5" fill="#334155">Pick symmetric 13x13 grid</text>
  <text x="36" y="128" font-size="10.5" fill="#334155">(~120 white cells) &amp; seed</text>
  <text x="36" y="143" font-size="10.5" fill="#334155">rare letters into 6 words:</text>
  <rect x="36" y="152" width="176" height="42" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="168" font-size="10.5" font-weight="600" fill="#1d4ed8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Q, Z, J, X, K, V</text>
  <text x="46" y="184" font-size="10" font-weight="600" fill="#1d4ed8">+ any missed letter on retry</text>
  <text x="36" y="213" font-size="10.5" fill="#64748b">75ms scored fill from tier's</text>
  <text x="36" y="228" font-size="10.5" fill="#64748b">everyday word list, then</text>
  <text x="36" y="243" font-size="10.5" fill="#64748b">shuffle <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">A..Z -&gt; 1..26</tspan></text>

  <line x1="226" y1="168" x2="252" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Step 2: Sequential Starter Selection and Verification Loop -->
  <rect x="256" y="72" width="242" height="52" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="270" y="90" font-size="11.5" font-weight="700" fill="#1d4ed8">2a. Pick Opening Starters</text>
  <text x="270" y="104.5" font-size="10" fill="#334155">Cluster 2+ starters in a familiar 4-7</text>
  <text x="270" y="117" font-size="10" fill="#64748b">letter word &amp; cap pre-filled cells</text>

  <line x1="377" y1="124" x2="377" y2="140" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowBlueSm)"/>

  <rect x="256" y="142" width="242" height="52" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="270" y="160" font-size="11.5" font-weight="700" fill="#1d4ed8">2b. Human Solve Simulator</text>
  <text x="270" y="174.5" font-size="10" fill="#334155">Deduce only from words with at least</text>
  <text x="270" y="187" font-size="10" fill="#64748b">1 known letter (no blank-word leaps)</text>

  <line x1="377" y1="194" x2="377" y2="210" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowBlueSm)"/>

  <rect x="256" y="212" width="242" height="52" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="270" y="230" font-size="11.5" font-weight="700" fill="#1d4ed8">2c. 85k-Word Uniqueness Check</text>
  <text x="270" y="244.5" font-size="10" fill="#334155">Prove 1 solution in broad dictionary</text>
  <text x="270" y="257" font-size="10" fill="#64748b">(rules out swaps like JUMP / BUMP)</text>

  <line x1="498" y1="168" x2="524" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Step 3: Per-Tier Settings -->
  <rect x="528" y="72" width="230" height="56" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
  <text x="540" y="91" font-size="11.5" font-weight="700" fill="#14532d">Easy: 4 starters</text>
  <text x="540" y="106" font-size="10" fill="#15803d">1 vowel (not E) + 3 consonants</text>
  <text x="540" y="120" font-size="10" fill="#15803d">At most 20 cells, household words</text>

  <rect x="528" y="140" width="230" height="56" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="540" y="159" font-size="11.5" font-weight="700" fill="#92400e">Medium: 3 starters (no E)</text>
  <text x="540" y="174" font-size="10" fill="#334155">2 in opening word + 1 consonant</text>
  <text x="540" y="188" font-size="10" fill="#334155">At most 14 cells (~88% starts blank)</text>

  <rect x="528" y="208" width="230" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="540" y="227" font-size="11.5" font-weight="700" fill="#991b1b">Hard: 2 consonant starters</text>
  <text x="540" y="242" font-size="10" fill="#b91c1c">Both in 1 opening word, at most 8</text>
  <text x="540" y="256" font-size="10" fill="#b91c1c">cells (~93% blank), 1-2 word steps</text>

  <text x="390" y="291" font-size="11.5" fill="#64748b" text-anchor="middle">
    Grids are built from curated everyday word lists, while uniqueness is always proven against all 85,000 words
  </text>
</svg>
