<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" width="780" height="296" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="776" height="292" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <text x="22" y="28" font-size="15" font-weight="700" fill="#e6edf3">Corrective-First, Constructive-Second Hint Flow</text>
  <text x="22" y="47" font-size="12" fill="#8b949e">With 1-to-1 letters enforced in the UI and one proven solution, hints clear wrong guesses before revealing new letters</text>

  <!-- Player's Board Input -->
  <rect x="22" y="74" width="176" height="72" rx="7" fill="#13233a" stroke="#388bfd" stroke-width="1.5"/>
  <text x="110" y="98" font-size="12" font-weight="700" fill="#a5d6ff" text-anchor="middle">Player's Board</text>
  <text x="110" y="116" font-size="10.5" fill="#79c0ff" text-anchor="middle">UI blocks letter reuse;</text>
  <text x="110" y="131" font-size="10.5" fill="#79c0ff" text-anchor="middle">check vs. unique solution</text>

  <!-- TOP PATH: Corrective (Remove) -->
  <line x1="198" y1="110" x2="280" y2="110" stroke="#d29922" stroke-width="1.7" marker-end="url(#arrowAmber)"/>
  <text x="239" y="101" font-size="10.5" font-weight="700" fill="#f2cc60" text-anchor="middle">mismatch</text>

  <rect x="284" y="74" width="474" height="72" rx="7" fill="#2d2111" stroke="#d29922" stroke-width="1.5"/>
  <text x="302" y="96" font-size="12" font-weight="700" fill="#f2cc60">Corrective Hint (remove): clear a wrong guess</text>
  <text x="302" y="115" font-size="10.5" fill="#c9d1d9">Flags a placed letter that disagrees with the solution before bad crossings</text>
  <text x="302" y="131" font-size="10.5" fill="#c9d1d9">pile up (or collide with a letter a later reveal would want to place)</text>

  <!-- BOTTOM PATH: Constructive (Reveal) -->
  <path d="M 110 146 L 110 207 L 280 207" fill="none" stroke="#3fb950" stroke-width="1.7" marker-end="url(#arrowGreen)"/>
  <text x="120" y="180" font-size="10.5" font-weight="700" fill="#56d364">all placed</text>
  <text x="120" y="194" font-size="10.5" fill="#56d364">letters match</text>

  <rect x="284" y="168" width="474" height="78" rx="7" fill="#12261e" stroke="#2ea043" stroke-width="1.5"/>
  <text x="302" y="190" font-size="12" font-weight="700" fill="#7ee787">Constructive Hint (reveal): help finish an active word</text>
  <text x="302" y="209" font-size="10.5" fill="#c9d1d9">Scores each unassigned number by cell count (up to 6 cells = 12 pts)</text>
  <text x="302" y="227" font-size="10.5" font-weight="700" fill="#56d364">plus started-word bonuses: +20 (1 blank left), +12 (2 blanks), +4 (3+ blanks)</text>

  <text x="390" y="275" font-size="11.5" fill="#8b949e" text-anchor="middle">
    Capping the cell-count bonus at 12 ensures finishing a 1-blank word (+20) beats dumping a 20-cell E across the grid
  </text>
</svg>
