<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 326" width="780" height="326" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="776" height="322" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="22" y="28" font-size="15" font-weight="700" fill="#0f172a">Arc Consistency Across an Unassigned Overlap</text>
  <text x="22" y="47" font-size="12" fill="#475569">2-Across lost candidates; find unsupported letters at the shared cell and prune them from 1-Down</text>

  <!-- ================= LEFT: MINI CROSSWORD CROSSING ================= -->
  <text x="100" y="72" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Shared cell (pos 2)</text>

  <!-- Vertical 1-Down cells (x=86, y=82..222) -->
  <rect x="86" y="82" width="28" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="86" y="110" width="28" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="86" y="166" width="28" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="86" y="194" width="28" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>

  <!-- Horizontal 2-Across cells (x=30..170, y=138) -->
  <rect x="30" y="138" width="28" height="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="58" y="138" width="28" height="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="114" y="138" width="28" height="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="142" y="138" width="28" height="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>

  <!-- Shared intersection square -->
  <rect x="86" y="138" width="28" height="28" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="100" y="157" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">?</text>

  <text x="30" y="132" font-size="10.5" font-weight="700" fill="#1d4ed8">2-Across</text>
  <text x="120" y="99" font-size="10.5" font-weight="700" fill="#475569">1-Down</text>

  <!-- Vertical separator -->
  <line x1="190" y1="68" x2="190" y2="222" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- ================= RIGHT: 26-BIT LETTER CHECK ================= -->
  <!-- Column letter headers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="384" y="80" fill="#334155">'a'</text>
    <text x="434" y="80" fill="#334155">'e'</text>
    <text x="484" y="80" fill="#b91c1c">'i'</text>
    <text x="534" y="80" fill="#334155">'o'</text>
    <text x="584" y="80" fill="#94a3b8">'q'</text>
    <text x="634" y="80" fill="#b91c1c">'r'</text>
    <text x="684" y="80" fill="#334155">'t'</text>
    <text x="734" y="80" font-size="11" fill="#64748b">..z</text>
  </g>

  <!-- Row 1: supported in 2-Across -->
  <text x="204" y="105" font-size="12" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">supported</text>
  <text x="204" y="120" font-size="10.5" fill="#64748b">live in 2-Across (26 bits)</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <!-- 1, 1, 0, 1, 0, 0, 1, ... -->
    <rect x="362" y="90" width="44" height="32" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="384" y="111" fill="#1d4ed8">1</text>

    <rect x="412" y="90" width="44" height="32" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="434" y="111" fill="#1d4ed8">1</text>

    <rect x="462" y="90" width="44" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="484" y="111" fill="#94a3b8">0</text>

    <rect x="512" y="90" width="44" height="32" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="534" y="111" fill="#1d4ed8">1</text>

    <rect x="562" y="90" width="44" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="584" y="111" fill="#94a3b8">0</text>

    <rect x="612" y="90" width="44" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="634" y="111" fill="#94a3b8">0</text>

    <rect x="662" y="90" width="44" height="32" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="684" y="111" fill="#1d4ed8">1</text>

    <rect x="712" y="90" width="44" height="32" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="734" y="110" font-size="12" fill="#64748b">...</text>
  </g>

  <!-- Row 2: possible in 1-Down -->
  <text x="204" y="147" font-size="12" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">possible</text>
  <text x="204" y="162" font-size="10.5" fill="#64748b">in 1-Down word list (26 bits)</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <!-- 1, 1, 1, 1, 0, 1, 1, ... -->
    <rect x="362" y="132" width="44" height="32" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="384" y="153" fill="#15803d">1</text>

    <rect x="412" y="132" width="44" height="32" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="434" y="153" fill="#15803d">1</text>

    <rect x="462" y="132" width="44" height="32" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="484" y="153" fill="#15803d">1</text>

    <rect x="512" y="132" width="44" height="32" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="534" y="153" fill="#15803d">1</text>

    <rect x="562" y="132" width="44" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="584" y="153" fill="#94a3b8">0</text>

    <rect x="612" y="132" width="44" height="32" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="634" y="153" fill="#15803d">1</text>

    <rect x="662" y="132" width="44" height="32" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="684" y="153" fill="#15803d">1</text>

    <rect x="712" y="132" width="44" height="32" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="734" y="152" font-size="12" fill="#64748b">...</text>
  </g>

  <!-- Operator divider -->
  <line x1="204" y1="176" x2="756" y2="176" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 4"/>
  <rect x="444" y="167" width="230" height="18" rx="9" fill="#e2e8f0"/>
  <text x="559" y="180" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">possible &amp; ^supported</text>

  <!-- Row 3: unsupported letters -->
  <text x="204" y="203" font-size="12" font-weight="600" fill="#b91c1c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">unsupported</text>
  <text x="204" y="218" font-size="10.5" fill="#64748b">to prune in 1-Down (26 bits)</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <!-- 0, 0, 1, 0, 0, 1, 0, ... -->
    <rect x="362" y="188" width="44" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="384" y="209" fill="#94a3b8">0</text>

    <rect x="412" y="188" width="44" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="434" y="209" fill="#94a3b8">0</text>

    <rect x="462" y="188" width="44" height="32" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="484" y="209" fill="#b91c1c">1</text>

    <rect x="512" y="188" width="44" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="534" y="209" fill="#94a3b8">0</text>

    <rect x="562" y="188" width="44" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="584" y="209" fill="#94a3b8">0</text>

    <rect x="612" y="188" width="44" height="32" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="634" y="209" fill="#b91c1c">1</text>

    <rect x="662" y="188" width="44" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="684" y="209" fill="#94a3b8">0</text>

    <rect x="712" y="188" width="44" height="32" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="734" y="208" font-size="12" fill="#64748b">...</text>
  </g>

  <!-- ================= BOTTOM: PRUNE UNSUPPORTED LETTERS FROM 1-DOWN ================= -->
  <!-- Vertical arrows from unsupported letters 'i' and 'r' -->
  <line x1="484" y1="220" x2="484" y2="242" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <line x1="634" y1="220" x2="634" y2="242" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>

  <!-- Step 2 explanation card -->
  <rect x="22" y="246" width="368" height="62" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="36" y="266" font-size="12" font-weight="700" fill="#0f172a">Prune unsupported letters from 1-Down</text>
  <text x="36" y="284" font-size="11.5" fill="#334155">Scan 1-Down's bitmask for each unsupported letter</text>
  <text x="36" y="300" font-size="11" fill="#64748b">('q' stays 0 above since no 1-Down word has 'q' at pos 2)</text>

  <line x1="390" y1="277" x2="406" y2="277" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowSlate)"/>

  <!-- Unsupported letter 'i' candidate bitmask card -->
  <rect x="410" y="246" width="168" height="62" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="494" y="265" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">1-Down 'i' bitmask</text>
  <text x="494" y="283" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ByPosAndLetter[2]['i']</text>
  <text x="494" y="300" font-size="10.5" fill="#991b1b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">liveBits &amp; mask -&gt; prune</text>

  <!-- Unsupported letter 'r' candidate bitmask card -->
  <rect x="590" y="246" width="168" height="62" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="674" y="265" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">1-Down 'r' bitmask</text>
  <text x="674" y="283" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ByPosAndLetter[2]['r']</text>
  <text x="674" y="300" font-size="10.5" fill="#991b1b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">liveBits &amp; mask -&gt; prune</text>
</svg>
