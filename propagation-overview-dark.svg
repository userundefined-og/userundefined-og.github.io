<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" width="780" height="264" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="776" height="260" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="22" y="28" font-size="15" font-weight="700" fill="#e6edf3">Polling Candidates vs. Pushing Prunings Directly</text>
  <text x="22" y="47" font-size="12" fill="#8b949e">Example: sparse all-different on 5-letter words after assigning 1-Across = "crane"</text>

  <!-- ================= ROW 1: BEFORE ================= -->
  <text x="22" y="70" font-size="11.5" font-weight="700" fill="#ff7b72">Before: poll Supported() on every live candidate</text>

  <rect x="22" y="78" width="160" height="62" rx="6" fill="#21262d" stroke="#484f58" stroke-width="1.3"/>
  <text x="102" y="104" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">1-Across = "crane"</text>
  <text x="102" y="124" font-size="11" fill="#8b949e" text-anchor="middle">sparse all-different</text>

  <line x1="182" y1="109" x2="212" y2="109" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="216" y="78" width="338" height="62" rx="6" fill="#21262d" stroke="#484f58" stroke-width="1.3"/>
  <text x="385" y="102" font-size="12" font-weight="600" fill="#c9d1d9" text-anchor="middle">Check all 15,000 candidates in each 5-letter word</text>
  <text x="385" y="123" font-size="11" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">"aback"?  "abase"?  "abate"?  ...  "crane"?</text>

  <line x1="554" y1="109" x2="584" y2="109" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="588" y="78" width="170" height="62" rx="6" fill="#311619" stroke="#f85149" stroke-width="1.5"/>
  <text x="673" y="104" font-size="12" font-weight="700" fill="#ff7b72" text-anchor="middle">15,000 checks / word</text>
  <text x="673" y="123" font-size="11" fill="#ffa198" text-anchor="middle">just to prune "crane"</text>

  <!-- ================= ROW 2: NOW ================= -->
  <text x="22" y="168" font-size="11.5" font-weight="700" fill="#56d364">Now: sparse all-different prunes "crane" directly</text>

  <rect x="22" y="176" width="160" height="62" rx="6" fill="#13233a" stroke="#388bfd" stroke-width="1.5"/>
  <text x="102" y="202" font-size="12" font-weight="600" fill="#a5d6ff" text-anchor="middle">1-Across = "crane"</text>
  <text x="102" y="222" font-size="11" fill="#79c0ff" text-anchor="middle">sparse all-different</text>

  <line x1="182" y1="207" x2="212" y2="207" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="216" y="176" width="338" height="62" rx="6" fill="#12261e" stroke="#2ea043" stroke-width="1.5"/>
  <text x="385" y="200" font-size="12" font-weight="600" fill="#7ee787" text-anchor="middle">Prune only "crane" from each other 5-letter word</text>
  <text x="385" y="221" font-size="11" fill="#56d364" text-anchor="middle">clears 1 bit per word via PruneFromVar</text>

  <line x1="554" y1="207" x2="584" y2="207" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="588" y="176" width="170" height="62" rx="6" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="673" y="202" font-size="12" font-weight="700" fill="#56d364" text-anchor="middle">1 bit check / word</text>
  <text x="673" y="221" font-size="11" fill="#7ee787" text-anchor="middle">other 14,999 untouched</text>
</svg>
