<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 246" width="780" height="246" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="776" height="242" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="22" y="28" font-size="15" font-weight="700" fill="#e6edf3">Shared Pruned-Values Slice</text>
  <text x="22" y="47" font-size="12" fill="#8b949e">Each node holds its own decision and a start offset into one shared slice of propagated prunings</text>

  <!-- ================= ROW 1: SEARCH NODES (1 DECISION EACH) ================= -->
  <!-- depth 0 spans [0..1] (x=22..226) -->
  <rect x="22" y="66" width="204" height="38" rx="6" fill="#13233a" stroke="#388bfd" stroke-width="1.4"/>
  <text x="32" y="89" font-size="11.5" font-weight="700" fill="#79c0ff">depth 0: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">v0 = 2</tspan></text>
  <text x="216" y="89" font-size="10.5" fill="#e6edf3" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">start = 0</text>
  <line x1="71" y1="104" x2="71" y2="124" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- depth 1 spans [2..4] (x=234..544) -->
  <rect x="234" y="66" width="310" height="38" rx="6" fill="#1e1f3b" stroke="#818cf8" stroke-width="1.4"/>
  <text x="244" y="89" font-size="11.5" font-weight="700" fill="#a5b4fc">depth 1: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">v1 = 7</tspan></text>
  <text x="534" y="89" font-size="10.5" fill="#e6edf3" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">start = 2</text>
  <line x1="283" y1="104" x2="283" y2="124" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>

  <!-- depth 2 spans [5..6] (x=552..756) -->
  <rect x="552" y="66" width="204" height="38" rx="6" fill="#2d2110" stroke="#d29922" stroke-width="1.6"/>
  <text x="562" y="89" font-size="11.5" font-weight="700" fill="#f2cc60">depth 2: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">v6 = 1</tspan></text>
  <text x="746" y="89" font-size="10.5" fill="#e6edf3" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">start = 5</text>
  <line x1="601" y1="104" x2="601" y2="124" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- ================= ROW 2: SHARED PROPAGATED PRUNINGS SLICE [0..6] ================= -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <!-- [0] -->
    <rect x="22" y="128" width="98" height="48" rx="5" fill="#13233a" stroke="#388bfd" stroke-width="1.3"/>
    <text x="71" y="147" font-size="10.5" font-weight="700" fill="#79c0ff">[0]</text>
    <text x="71" y="165" font-size="11" fill="#e6edf3">v3 != 12</text>

    <!-- [1] -->
    <rect x="128" y="128" width="98" height="48" rx="5" fill="#13233a" stroke="#388bfd" stroke-width="1.3"/>
    <text x="177" y="147" font-size="10.5" font-weight="700" fill="#79c0ff">[1]</text>
    <text x="177" y="165" font-size="11" fill="#e6edf3">v7 != 4</text>

    <!-- [2] -->
    <rect x="234" y="128" width="98" height="48" rx="5" fill="#1e1f3b" stroke="#818cf8" stroke-width="1.3"/>
    <text x="283" y="147" font-size="10.5" font-weight="700" fill="#a5b4fc">[2]</text>
    <text x="283" y="165" font-size="11" fill="#e6edf3">v2 != 9</text>

    <!-- [3] -->
    <rect x="340" y="128" width="98" height="48" rx="5" fill="#1e1f3b" stroke="#818cf8" stroke-width="1.3"/>
    <text x="389" y="147" font-size="10.5" font-weight="700" fill="#a5b4fc">[3]</text>
    <text x="389" y="165" font-size="11" fill="#e6edf3">v5 != 1</text>

    <!-- [4] -->
    <rect x="446" y="128" width="98" height="48" rx="5" fill="#1e1f3b" stroke="#818cf8" stroke-width="1.3"/>
    <text x="495" y="147" font-size="10.5" font-weight="700" fill="#a5b4fc">[4]</text>
    <text x="495" y="165" font-size="11" fill="#e6edf3">v5 != 8</text>

    <!-- [5] -->
    <rect x="552" y="128" width="98" height="48" rx="5" fill="#2d2110" stroke="#d29922" stroke-width="1.5"/>
    <text x="601" y="147" font-size="10.5" font-weight="700" fill="#f2cc60">[5]</text>
    <text x="601" y="165" font-size="11" fill="#e6edf3">v4 != 3</text>

    <!-- [6] -->
    <rect x="658" y="128" width="98" height="48" rx="5" fill="#2d2110" stroke="#d29922" stroke-width="1.5"/>
    <text x="707" y="147" font-size="10.5" font-weight="700" fill="#f2cc60">[6]</text>
    <text x="707" y="165" font-size="11" fill="#e6edf3">v8 != 6</text>
  </g>

  <!-- ================= ROW 3: REVERSE UNDO ARROW ================= -->
  <line x1="744" y1="196" x2="564" y2="196" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="654" y="216" font-size="11" font-weight="700" fill="#ff7b72" text-anchor="middle">restore [6], then [5]</text>

  <text x="22" y="216" font-size="11.5" fill="#c9d1d9">
    Backtracking from depth 2 restores down to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#e6edf3">start = 5</tspan>, then clears <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#e6edf3">v6 = 1</tspan>
  </text>
</svg>
